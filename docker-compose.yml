services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: plant-allocation-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/data/allocation.db
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL}
      MOCK_LLM: ${MOCK_LLM:-false}
      # Ollama runs on the host machine (Section 8)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite DB, traces and CSVs persist on the host. Load judge data with:
      #   docker compose exec api python scripts/load_data.py --dir data/raw
      - ./data:/app/data
    restart: unless-stopped

